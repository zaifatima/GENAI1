<div id="language-step" class="quiz-step">
  <h2 class="text-2xl font-bold mb-4">Pick your languages (Select all that apply)</h2>
  
  <div class="flex flex-wrap gap-3">
    <label class="lang-chip">
      <input type="checkbox" value="english" class="hidden"> 🇺🇸 English
    </label>
    <label class="lang-chip">
      <input type="checkbox" value="spanish" class="hidden"> 🇪🇸 Spanish
    </label>
    <label class="lang-chip">
      <input type="checkbox" value="hindi" class="hidden"> 🇮🇳 Hindi
    </label>
    <label class="lang-chip">
      <input type="checkbox" value="japanese" class="hidden"> 🇯🇵 Japanese
    </label>
  </div>
  
  <button onclick="nextStep()" class="mt-6 bg-blue-600 text-white px-6 py-2 rounded">
    Generate My Mix
  </button>
</div>
